name: verify release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published npm and GitHub release version
        required: true
        default: '1.1.4'
      asset:
        description: Optional single asset to verify
        required: false
        default: ''
      installer_from_checkout:
        description: Test the checkout installer against the published package
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.asset }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            image: node:24-slim
            asset: napi-v6-linux-x64-glibc.tar.gz
          - platform: linux/arm64
            image: node:24-slim
            asset: napi-v6-linux-arm64-glibc.tar.gz
          - platform: linux/ppc64le
            image: node:24-slim
            asset: napi-v6-linux-ppc64-glibc.tar.gz
          - platform: linux/arm/v7
            image: node:22-slim
            asset: napi-v6-linux-arm-glibc.tar.gz
          - platform: linux/s390x
            image: node:20-slim
            asset: napi-v6-linux-s390x-glibc.tar.gz
          - platform: linux/amd64
            image: python:3.11-alpine
            asset: napi-v6-linux-x64-musl.tar.gz
          - platform: linux/arm64
            image: python:3.11-alpine
            asset: napi-v6-linux-arm64-musl.tar.gz
          - platform: linux/ppc64le
            image: python:3.11-alpine
            asset: napi-v6-linux-ppc64-musl.tar.gz
          - platform: linux/s390x
            image: python:3.11-alpine
            asset: napi-v6-linux-s390x-musl.tar.gz
          - platform: linux/386
            image: python:3.11-alpine
            asset: napi-v6-linux-ia32-musl.tar.gz
          - platform: linux/arm/v7
            image: python:3.11-alpine
            asset: napi-v6-linux-arm-musl-armv7.tar.gz
          - platform: linux/arm/v6
            image: python:3.11-alpine
            asset: napi-v6-linux-arm-musl-armv6.tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - name: Install published package and test release binary
        if: inputs.asset == '' || inputs.asset == matrix.asset
        run: |
          docker run --rm --platform '${{ matrix.platform }}' \
            --env VERSION='${{ inputs.version }}' \
            --env ASSET='${{ matrix.asset }}' \
            --env INSTALLER_FROM_CHECKOUT='${{ inputs.installer_from_checkout }}' \
            --volume '${{ github.workspace }}:/work:ro' \
            '${{ matrix.image }}' sh -euc '
              if [ -f /etc/alpine-release ]; then
                apk add --no-cache nodejs npm
                echo "Alpine arch: $(cat /etc/apk/arch)"
                echo "Node ARM version: $(node -p process.config.variables.arm_version)"
                ls -l /lib/ld-musl-* || true
              fi
              mkdir -p /tmp/release-check
              cd /tmp/release-check
              if [ "$INSTALLER_FROM_CHECKOUT" = true ]; then
                npm install --ignore-scripts --no-audit --no-fund "@whyour/sqlite3@${VERSION}"
                cp /work/tools/install-prebuild.js node_modules/@whyour/sqlite3/tools/install-prebuild.js
                (cd node_modules/@whyour/sqlite3 && node tools/install-prebuild.js)
              else
                npm install --no-audit --no-fund --foreground-scripts "@whyour/sqlite3@${VERSION}"
              fi
              node /work/tools/verify-release-package.js "$ASSET" "$VERSION"
            '

  winmac:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            asset: napi-v6-darwin-arm64-unknown.tar.gz
          - os: macos-latest
            arch: x64
            asset: napi-v6-darwin-x64-unknown.tar.gz
          - os: windows-latest
            arch: x64
            asset: napi-v6-win32-x64-unknown.tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
      - name: Install published package and test release binary
        if: inputs.asset == '' || inputs.asset == matrix.asset
        shell: bash
        run: |
          mkdir release-check
          cd release-check
          printf '{"private":true}\n' > package.json
          npm install --no-audit --no-fund --foreground-scripts '@whyour/sqlite3@${{ inputs.version }}'
          node "$GITHUB_WORKSPACE/tools/verify-release-package.js" '${{ matrix.asset }}' '${{ inputs.version }}'
