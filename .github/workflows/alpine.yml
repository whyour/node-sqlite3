name: alpine
on:
  workflow_dispatch:
env:
  FORCE_COLOR: 1
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  build-qemu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
        target:
          - linux/arm64
          - linux/amd64
          - linux/ppc64le
          - linux/s390x
          - linux/386
          - linux/arm/v7
        variant:
          - alpine3.15
    name: ${{ matrix.variant }} (node=${{ matrix.node }}, target=${{ matrix.target }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Add env vars
        id: vars
        shell: bash
        run: |
          echo "V=1" >> $GITHUB_ENV
          
          if [[ "${{ matrix.target }}" = "linux/arm/v7" ]]; then 
            TARGET=arm
          elif [ "${{ matrix.target }}" = "linux/arm64" ]; then
            TARGET=arm64
          elif [ "${{ matrix.target }}" = "linux/amd64" ]; then
            TARGET=x64
          elif [ "${{ matrix.target }}" = "linux/ppc64le" ]; then
            TARGET=ppc64
          elif [ "${{ matrix.target }}" = "linux/s390x" ]; then
            TARGET=s390x
          elif [ "${{ matrix.target }}" = "linux/386" ]; then
            TARGET=ia32
          fi
          echo "TARGET=$TARGET" >> $GITHUB_ENV
          echo "artifact_name=prebuilt-binaries-alpine-$TARGET" >> $GITHUB_OUTPUT

          cat $GITHUB_ENV

      - name: Build binaries and test
        run: |
          docker buildx build \
            --file ./tools/BinaryBuilder-alpine.Dockerfile \
            --load \
            --tag sqlite-builder \
            --platform ${{ matrix.target }} \
            --no-cache \
            --build-arg VARIANT=${{ matrix.variant }} \
            --build-arg TARGET=${{ env.TARGET }} \
            --build-arg NODE_VERSION=${{ matrix.node }} \
            .
          CONTAINER_ID=$(docker create -it sqlite-builder)
          docker cp $CONTAINER_ID:/usr/src/build/build/ ./build

      - name: Upload binaries to commit artifacts
        uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: build/stage/*/*
          retention-days: 7

      - name: Upload binaries to GitHub Release
        run: yarn install --ignore-scripts && yarn node-pre-gyp-github publish --release
        if: matrix.node == 22
        env:
          NODE_PRE_GYP_GITHUB_TOKEN: ${{ secrets.API_TOKEN }}
